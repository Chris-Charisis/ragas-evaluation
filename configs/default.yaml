# Single source of truth for a run. Every stage reads this file (via chunkeval.core.config).
# Rule of thumb: anything you might change between experiments belongs here, not in code.
# Another experiment: a config that starts with `extends: default.yaml` and holds only what differs,
# passed with --config (see docs/development.md#configs-for-other-experiments).

run_id: "full_data-v1.0"            # artefacts go to runs/<run_id>/ — bump it for every new experiment
seed: 42                      # used for sampling docs/units/questions, the bootstrap and the LLM `seed` parameter

paths:
  # Parsed docs, chunks, vectors (embedding.cache_dir) and the question set. Another data dir gets
  # its own Weaviate collections too (weaviate.collection_template).
  data_dir: "data"
  runs_dir: "runs"
  # The answer and judge caches, shared by every run_id and data dir: keyed by everything that
  # decides a call, so a new run never pays the judge again for a call already made.
  llm_cache_dir: "data/llm_cache"
  # Docling needs the ORIGINAL PDFs, not the extracted_text JSONs.
  corpora:
    papers: "data/corpora/papers"
    reports: "data/corpora/reports"

parsing:
  # Allowlist of Docling item labels that become text in CanonicalDoc; every other label is ignored.
  # v1 = headings + running text. "caption" and "footnote" also work (just add them here);
  # tables need parsing.table_text first. Page headers/footers never reach this filter: Docling
  # puts them in its "furniture" layer and parse_pdf reads the body layer only.
  include_labels: ["title", "section_header", "text", "paragraph", "list_item"]
  # Heading levels (Docling reports level 1 for every PDF heading), see parsing.infer_heading_levels:
  #   "font_size": numbering ("2.1 Data" -> 2) where present, else the heading's font size in the PDF
  #   "numbering": numbering only, unnumbered headings are level 1
  #   "flat":      every heading is level 1, so sections never nest
  heading_levels: "font_size"
  # A PDF whose text layer exceeds either ratio is converted again with full-page OCR (see
  # parsing.text_layer_problems).
  ocr_max_replacement_char_ratio: 0.01     # share of "�" (fonts without Unicode map); report_16: 0.71
  ocr_max_repeated_paragraph_ratio: 0.05   # duplicated hidden text layer; paper_4: 0.12, report_15: 0.007
  # Title lists below match the whole heading, case, numbering and punctuation ignored, plus one
  # short trailing identifier: "5. References" -> "references", "Appendix A" -> "appendix",
  # "Publications 2019" -> "publications". So list other variants explicitly.
  # Which part of each document becomes CanonicalDoc.text, per corpus (see parsing.select_body);
  # what each document lost is in its meta.body. Changing a rule re-parses that corpus.
  body:
    papers:
      # Keep from the first of these headings (title, authors, affiliations, abstract dropped).
      # Results too (2026-10-20): Nature-style papers have no Introduction heading and put Methods
      # last, so starting at "Methods" dropped their Results and Discussion (paper_99, 117, 141, 111:
      # 68-83% of the paper); now they lose only the unheaded intro paragraphs.
      # Not discussion: it follows Results. None found -> kept from the beginning (logged).
      start_titles: ["introduction", "background", "related work", "literature review",
                     "materials and methods", "material and methods", "methods", "methodology", "theory",
                     "results", "results and discussion"]
      # ...up to the first of these after the start: a heading, or a paragraph opening with it
      # ("Funding: ...", how MDPI prints its back matter). None found -> kept to the end (logged).
      end_titles: ["references", "bibliography", "literature cited", "references cited",
                   "acknowledgements", "acknowledgments", "acknowledgement", "acknowledgment",
                   "appendix", "appendices", "annex", "annexes",
                   "supplementary materials", "supplementary material", "supplementary information",
                   "supplementary data", "additional file", "additional files", "additional information",
                   "author contributions", "authors' contributions", "credit authorship contribution statement",
                   "author information", "funding", "conflicts of interest", "conflict of interest",
                   "competing interests", "declaration of competing interest", "disclosure statement",
                   "declarations", "ethics declarations", "data availability", "data availability statement",
                   "availability of data and materials", "institutional review board statement",
                   "informed consent statement"]
    reports:
      # No start/end cut: reports have no fixed order. Each of these sections is dropped with
      # its subsections, wherever it is (only its own text if they'd exceed 20% of the document).
      # Extended 2026-10-20 from the section titles of the full corpus: contents and lists, front
      # and back matter, abstracts in other languages, annexes (agendas, participant lists,
      # questionnaires; papers are cut at their appendices too).
      drop_titles: ["references", "bibliography", "literature cited", "references cited", "publications",
                    "acknowledgements", "acknowledgments", "acknowledgement", "acknowledgment",
                    "abbreviations", "acronyms", "abbreviations and acronyms", "acronyms and abbreviations",
                    "list of abbreviations", "list of acronyms", "list of abbreviations and acronyms",
                    "table of contents", "table of content", "contents", "content", "contenu",
                    "list of figures", "list of tables", "list of figures and tables",
                    "list of tables and figures", "table of figures", "table of tables", "figures",
                    "disclaimer", "standard disclaimer", "citation", "correct citation", "recommended citation",
                    "about the authors", "authors", "contact", "contacts", "contact us",
                    "copyright", "copyright statement", "credits", "photographs", "photos",
                    "keywords", "glossary", "index", "board of trustees", "publications in this series"]
      # A section whose title's first word is one of these: "Annex 2: Workshop agenda".
      drop_title_prefixes: ["annex", "annexes", "appendix", "appendices"]
  # Sections Q-A generation skips among those parsing.body keeps (chunkers still index them).
  skip_section_titles: ["references", "acknowledgements", "acknowledgments", "table of contents", "contents"]
  # Titles that replace the one Docling found (none, or a banner like "RTB Working Paper"): the
  # title is shown to the Q-A generator and the critic. Filled from each PDF's first page (2026-10-20).
  title_overrides: "configs/titles.csv"

embedding:
  primary: "bge_m3"                  # main grid: span metrics + RAG answers + Ragas
  secondary: ["qwen3_06b"]           # robustness check: span metrics only
  batch_size: 32
  # cache_dir: not set, so <paths.data_dir>/embeddings: each data dir keeps its own vectors.
  # `name` doubles as the Weaviate named-vector name (letters, digits, underscores only).
  # Both models output 1024-dim normalised vectors (cosine) — dimension checks can't tell them apart.
  # `revision`: the Hub commit to load (full 40-char hash; a branch like "main" is rejected). Without
  # it every load takes the latest commit, so an upstream push could change the vectors mid-experiment,
  # e.g. queries embedded by a newer model than the documents they are searched against.
  # Changing it makes `chunkeval embed` re-embed every chunk file of that model.
  models:
    bge_m3:
      model_id: "BAAI/bge-m3"        # 8192-token context, CLS pooling, dense output used here
      revision: "5617a9f61b028005a4858fdac845db406aefb181"   # main on 2026-10-11 (last changed 2024-07-03)
      query_prompt: ""               # bge-m3 needs no query instruction
      document_prompt: ""
      max_seq_length: 2048           # far above any chunk; caps batch memory
      dim: 1024
    qwen3_06b:
      model_id: "Qwen/Qwen3-Embedding-0.6B"   # 32k context, last-token pooling
      revision: "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"   # main on 2026-10-11 (last changed 2026-04-20)
      # Task-specific instruction, format "Instruct: <task>\nQuery:" (the question follows directly).
      # One instruction for both corpora, so papers vs reports differ only in the documents.
      # Changing it changes Qwen's retrieval results — the query-embedding cache keys on its hash.
      query_prompt: "Instruct: Given a question about a scientific paper or report, retrieve the passages that contain the evidence answering the question\nQuery:"
      document_prompt: ""            # documents get NO instruction
      max_seq_length: 2048
      dim: 1024

# `chunkeval chunk` runs EVERY combination of `methods` x `overlap` in one run (6 variants), for
# every corpus (or those given with --corpus): one data/chunks/<corpus>/<method>_<ovl>.jsonl each,
# plus _size_stats.json. There is no mode switch: to run a subset, shorten the two lists here (or in
# a copy passed with --config); analysis.baseline must stay one of the remaining variants.
# Only the sizes below are configurable. The cutting rules are fixed in code and documented in each
# chunker's docstring (corpus/chunking/): soft target (a sentence/paragraph joins a chunk while that
# brings it closer to target_tokens), character windows calibrated per corpus and snapped to
# whitespace, at least one whole sentence of overlap capped at target/2, a last chunk under
# target/2 merged into the previous one.
chunking:
  size_tokenizer: "BAAI/bge-m3"      # ALL chunk sizes are measured in this tokenizer (one ruler for every method)
  # Pinned like embedding.models.*.revision: a new tokenizer version could change token counts and
  # so chunk boundaries. Must equal embedding.models.bge_m3.revision (checked when the config loads),
  # so chunks are measured with exactly the tokenizer the primary embedder reads them with.
  size_tokenizer_revision: "5617a9f61b028005a4858fdac845db406aefb181"
  # Chosen to continue the previous round (docx: 200-word chunks, better precision/faithfulness
  # than 350). But 256 bge-m3 tokens are ~160 words, not 200: measured 1.6 tokens/word on the 4 dev
  # docs (161 words/chunk on papers, 160 on reports; XLM-R splits numbers, units and scientific
  # terms finely). So v2 chunks hold ~20% less text than the docx's; 200 words would be ~320.
  # Kept at 256 on purpose: comparisons between methods within this run are unaffected, and the
  # docx itself only trusts within-run comparisons. On the full corpus (2026-10-20) words_mean is
  # 158-159 for papers and 172 for reports (character, sentence): still ~1.5-1.6 tokens/word.
  # Not tuned either: size_sweep is the way to test other sizes.
  target_tokens: 256
  max_tokens: 512                    # experimental cap (no longer a model limit: bge-m3 reads 8192)
  overlap_ratio: 0.12                # 10–15% recommended; sentence methods round to whole sentences
  min_section_tokens: 40             # recursive: merge smaller sibling sections (within the same parent)
  # Keys, used in file names, chunk ids and collections. The report and the docs call character
  # "fixed-size" and recursive "section" (analysis/inputs.py, docs/corpus.md#chunk-chunk).
  methods: ["character", "sentence", "recursive"]
  overlap: [false, true]
  # NOT WIRED UP YET: no stage reads it, so setting it changes nothing. Intended: extra chunk sizes,
  # e.g. [128, 256, 512, 1024], evaluated with the deterministic span metrics only. A possible
  # extension after the project is complete, see docs/future-work.md.
  size_sweep: []

weaviate:
  host: "localhost"
  port: 8080
  grpc_port: 50051
  # "_v2": never overwrite the old collections. {namespace} is "" for data/ and "<name>_" for any
  # other data dir (data/size512 -> "size512_"), or weaviate.namespace when set.
  collection_template: "{namespace}{corpus}_{method}_{overlap}_v2"

ollama:
  # Expected SERVER settings (set in `sudo systemctl edit ollama`, see llm.py) — checked by llm.check_ollama.
  context_length: 8192               # OLLAMA_CONTEXT_LENGTH; too small = prompts silently truncated
  concurrency: 2                     # = OLLAMA_NUM_PARALLEL; more client threads add no throughput

llm:
  # Every role uses an OpenAI-compatible endpoint: "ollama" -> OLLAMA_BASE_URL, "openai" -> api.openai.com
  # Ollama model names are TAGS; every tag is a quantized GGUF (size = weights only, add KV cache).
  # ~14.4 GB VRAM free on the RTX 5070 Ti. Local candidates (sizes from ollama.com, Oct 2026):
  #   gemma4:12b-it-q8_0                   13 GB   dense, near-lossless quant; Ollama >= 0.30.5
  #                                                Ollama's fit keeps 1 of 48 layers on the CPU (99.5%, 16% slower);
  #   gemma4-allgpu:12b-it-q8_0                    the same model with num_gpu 49, 100% GPU  <- Q-A generator
  #                                                (build it: ollama create, see ollama/gemma4-allgpu.Modelfile)
  #   qwen3.5:9b-q8_0                      10 GB   newest gen, near-lossless quant, fits easily  <- RAG generator
  #   qwen3.5:9b  (= q4_K_M)               6.6 GB  same model, more room for parallel slots
  #   qwen3:14b   (= q4_K_M)               9.3 GB  larger, older gen, 4-bit
  #   qwen3:30b-a3b-instruct-2507-q4_K_M   19 GB   MoE (3B active), partial CPU offload, never "thinks"
  #   qwen3.5:35b-a3b-int4                 20 GB   MoE, partial CPU offload
  #   gpt-oss:20b                          14 GB   native MXFP4 only, MoE; 100% GPU on Ollama 0.40.6  <- critic
  #   NOT viable: qwen3:14b-q8_0 (16 GB), qwen3.5:27b (17 GB dense — offloading a dense model is slow)
  # Q-A generator: Gemma 4 (decided 2026-10-19, for the full corpus; the dev run used qwen3.5:9b-q8_0).
  # So the questions and gold answers come from another family than the RAG answers (Qwen), and the
  # critic is a third one (gpt-oss): keep it a different family from the generator.
  # reasoning_effort: without "none", Qwen3.5 thinks first and can spend all max_tokens on it (empty
  # answer). Gemma 4 thinks by default too (230 tokens for "17*23"); "none" turns it off (4 tokens).
  qa_generator:  {provider: "ollama", model: "gemma4-allgpu:12b-it-q8_0", temperature: 0.7, max_tokens: 512, reasoning_effort: "none"}
  qa_critic:     {provider: "ollama", model: "gpt-oss:20b",     temperature: 0.0, max_tokens: 1024, reasoning_effort: "low"}  # reasoning needs headroom
  rag_generator: {provider: "ollama", model: "qwen3.5:9b-q8_0", temperature: 0.0, max_tokens: 512, reasoning_effort: "none"}
  # Judge (Ragas, stage 8): gpt-6-luna, decided 2026-10-21 after a 20-question pilot with both judges
  # (docs/evaluation.md). It replaced gpt-4.1-mini-2025-04-14, which OpenAI shuts down on 2027-01-14 and
  # which judged on-topic chunks without the answer "useful" (34% of same-document chunks, against 11%).
  # A reasoning model: temperature 0 and the seed are accepted only with reasoning_effort "none" (then it
  # uses no reasoning tokens). No dated snapshot: OpenAI can update it behind the name, and its responses
  # carry no fingerprint to notice it by; every call is cached, so a finished run stays as it was.
  # Its price is in ragas.prices.
  judge:         {provider: "openai", model: "gpt-6-luna", temperature: 0.0, reasoning_effort: "none"}

# The prompt files, relative to the repo root. Their text is what the provenance records and cache
# keys hold, not the path: a copy with the same text elsewhere changes nothing.
prompts:
  qa_generation: "prompts/qa_generation.md"
  qa_critic: "prompts/qa_critic.md"
  rag_answer: "prompts/rag_answer.md"

qa:
  docs_per_corpus: 150
  max_questions_per_doc: 15          # units (= generator calls) per document, before filtering drops 40–60%
  # Single units: paragraphs of one section packed towards the middle (250), in bge-m3 tokens like
  # the chunks; a section with less text gets no unit (see qa.generation.sample_units).
  unit_min_tokens: 100
  unit_max_tokens: 400
  # Share of two-span units: two adjacent whole paragraphs, each >= unit_min_tokens / 2 and
  # together <= unit_max_tokens; the question must need both.
  # ON again (0.2, decided 2026-10-19, with Gemma 4): Gemma quotes single sentences, which the
  # sentence and recursive chunkers never cut, so without two-span units the evidence crossed a
  # chunk boundary for 0-2% of its questions. On the 10 dev docs, 20 two-span units gave 12 pairs
  # and 5 kept (Qwen, 2026-10-11: 3 pairs, none kept), and the kept set crosses a boundary for
  # 14-19% (sentence/recursive, no overlap). Costs ~15% of the questions: 36 kept instead of 44.
  two_span_ratio: 0.2
  question_types: ["factoid", "numeric", "definition", "reasoning"]
  fuzzy_match_threshold: 90          # rapidfuzz score (0–100) for locating evidence quotes
  # filter-qa: EVERY critic criterion (5; a two-span pair adds needs_both) must reach it, 1–5 scale.
  # Applied in code, so changing it asks the critic nothing again. Fallback if it rejects too many
  # good pairs: 3 (agreed 2026-10-11; calibrate with the hand labels, docs/qa.md, "Q-A filtering").
  # Dev docs (single units only): 4 keeps 35 of 84 pairs, 3 keeps 53.
  critic_min_score: 4
  dedup_cosine_threshold: 0.92       # bge-m3 cosine between two questions of one corpus

retrieval:
  embedders: ["bge_m3", "qwen3_06b"] # which named vectors to query (answering/Ragas use the primary only)
  # "dense" | "hybrid" (BM25 + dense, follow-up experiment). Recorded with every retrieval file:
  # switching it on a run_id that already has results is refused, so bump run_id for the follow-up.
  mode: "dense"
  hybrid_alpha: 0.5                  # hybrid only: 1 = pure vector, 0 = pure BM25
  top_k: 5                           # chunks handed to the RAG generator (answer)
  # Each question gets its k_max best chunks once; the span metrics are cut from that list at each
  # of k_values and at the budget-matched k. 20 chunks hold ~4000 tokens, far above the budget.
  k_max: 20
  k_values: [1, 3, 5, 10]
  budget_tokens: 1300                # for the budget-matched view (~5 x 256)

ragas:
  # Questions per corpus that `eval` scores, the same ones in every setup (paired). Drawn by a seeded
  # hash rank, so a smaller sample is the start of a larger one: the `--pilot` questions are part of
  # the full run, and raising this value only adds questions. All of them when a corpus has fewer.
  # Kept as a cost guardrail (decided 2026-10-12): ~$0.04 per question across its 7 setups. The sample is
  # not stratified (docs/future-work.md).
  sample_per_corpus: 500             # the 20-question pilot (2026-10-21) puts 500 at ~$9 with gpt-6-luna
  max_workers: 2                     # judge requests in flight; raise for the full corpus if the rate limit allows
  timeout: 120                       # seconds per judge request (the openai SDK's timeout)
  max_retries: 5                     # per request, by the openai SDK (backoff, honours Retry-After)
  # `eval` estimates the cost of every judge call it doesn't have cached and refuses to start above
  # this; while running it stops asking once the new spend reaches it (what was paid stays cached).
  # Dev docs: $1.29 measured for all 35 questions (gpt-4.1-mini). Full corpus at 500 per corpus: ~$9 with
  # gpt-6-luna, ~$37 with gpt-4.1-mini.
  max_cost_usd: 100
  # USD per 1M tokens (OpenAI list prices, Oct 2026), by judge model; the judge's must be here.
  prices:
    "gpt-6-luna": {input: 0.10, output: 0.50}
    "gpt-4.1-mini-2025-04-14": {input: 0.40, output: 1.60}   # the judge until 2026-10-21; its pilot is cached

analysis:
  bootstrap_iterations: 2000
  ci: 0.95
  baseline: "character_no_overlap"   # a variant key (fixed-size_no_overlap in the report); main tables use
                                     # embedding.primary; the secondary gets a robustness table
